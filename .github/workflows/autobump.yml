name: Auto-bump Formulae

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Tap this repository
        run: brew tap binsabbar/tap "$(pwd)"

      - name: Bump all formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for formula in consul-review tasklog vault-sync; do
            echo "==> Checking $formula"
            brew bump-formula-pr \
              --no-browse \
              --write-only \
              "binsabbar/tap/$formula" || echo "No update needed for $formula"
          done

      - name: Commit and push changes
        run: |
          tap_dir="$(brew --repository binsabbar/tap)"
          cd "$tap_dir"
          if git diff --quiet; then
            echo "All formulae are already up to date — nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add Formula/
          git commit -m "auto-bump: update formulae to latest releases"
          git push
